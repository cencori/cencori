#:schema https://brimble.io/schema/brimble.json

# Cencori on Brimble, Lagos (afr-west). See docs/rfcs/RFC-0001-supabase-to-brimble-postgres.md.
# Phase 0: the app runs here against Supabase as today; `db` is the empty
# target database for the migration rehearsals. Single node by decision
# (2026-10-21); HA would place replicas outside Nigeria.

[services.cencori]
type = "web"
region = "afr-west"

[services.cencori.build]
# The app is built on GitHub (.github/workflows/deploy.yml, deploy/app/Dockerfile):
# Brimble's builder can't hold `next build`. The root Dockerfile is one line,
# FROM the image for a commit, so Brimble only pulls it. The workflow updates
# that line after each image push, and only that change deploys.
watch = ["Dockerfile"]
# Build with the root Dockerfile (BuildKit), not Railpack.
dockerfile = "Dockerfile"

[services.cencori.deploy]
start = "node_modules/.bin/next start -H 0.0.0.0"
# Creates the Better Auth tables (idempotent). Workbench is read-only.
before_start = "node scripts/brimble-apply-sql.mjs"
health = "/api/v1/health"

[services.cencori.resources]
cpu = 2
memory = "4gb"

[services.cencori.env]
NODE_ENV = "production"
# The build must fit this 4GB container (Brimble killed it 2026-11-03). See
# next.config.ts: server packages are external, so the compile stays under a
# 3GB heap; keep the heap well inside the container.
NODE_OPTIONS = "--max-old-space-size=3072"
# next.config.ts turns off webpack's persistent cache: a fresh container
# never reuses it, and it holds gigabytes in memory while building.
BRIMBLE_BUILD = "1"
# Not read by the app yet; wired for Phase 2 of the RFC.
MIGRATION_DATABASE_URL = "{{@db.PRIVATE_CONNECTION_STRING}}"
# The `postgrest` project, created from the postgrest/postgrest:v16.5 image
# outside this file: Brimble builds services.rest with Railpack and ignores
# build.dockerfile. Move it back here once that's fixed.
POSTGREST_URL = "http://postgrest.virtual.brimble.internal:3000"

# PostgREST: the app's queries after the cutover (lib/data/postgrest-fetch.ts).
# Not serving yet (see POSTGREST_URL above); kept so the config is ready.
# libpq reads the PG* variables, so the password stays a secret, not a URI.
[services.rest]
type = "web"
region = "afr-west"
root = "deploy/postgrest"

[services.rest.build]
dockerfile = "Dockerfile"

[services.rest.deploy]
port = 3000
health = "/"

[services.rest.resources]
cpu = 1
memory = "1gb"

[services.rest.network]
public = false

[services.rest.env]
PGRST_DB_URI = "postgresql://"
PGHOST = "{{@db.PRIVATE_SERVICE_HOST}}"
PGPORT = "{{@db.SERVICE_PORT}}"
PGDATABASE = "{{@db.DB_NAME}}"
PGUSER = "authenticator"
PGRST_DB_SCHEMAS = "public"
PGRST_DB_ANON_ROLE = "anon"
PGRST_DB_EXTRA_SEARCH_PATH = "public,extensions"
PGRST_JWT_AUD = "authenticated"
PGRST_SERVER_PORT = "3000"

[services.rest.secrets]
required = ["PGPASSWORD", "PGRST_JWT_SECRET"]

[databases.db]
engine = "postgresql"
version = "17"
region = "afr-west"
cpu = 2
memory = "8gb"
disk = "50gb"
public = true
allow_ips = ["102.89.40.83/32"]
backups = { schedule = "0 2 * * *", timezone = "Africa/Lagos", keep = "30d" }
