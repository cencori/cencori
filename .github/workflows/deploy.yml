# Build cencori.com on GitHub and run it on Brimble.
#
# Brimble's builder can't hold `next build` (~12GB peak, killed since
# 2026-11-03), and Brimble won't raise it. GitHub's runners have 16GB. This
# builds deploy/app/Dockerfile and pushes ghcr.io/<repo>:<sha> and :latest.
# When the repo variable BRIMBLE_IMAGE_DEPLOY is "true", it then pins that
# image in the root Dockerfile and pushes the change. Brimble watches only that
# file (brimble.toml build.watch), so the pinned image is what deploys. Brimble
# keeps the old deployment until the new one passes its health check. Roll back
# by pointing the Dockerfile at an older tag.
#
# Needs: secret BRIMBLE_API_KEY (reads the project's NEXT_PUBLIC_* values).
name: Deploy

on:
  push:
    branches: [master]
    # The release commit below only changes Dockerfile; don't rebuild for it.
    paths-ignore: [Dockerfile]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  BRIMBLE_PROJECT_ID: 6ad91578cd318e60aec7f0e1
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: meta
        run: |
          image="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          echo "image=${image}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=${image}:latest" >> "$GITHUB_OUTPUT"

      # Only NEXT_PUBLIC_* values: they end up in the browser bundles anyway.
      - name: Fetch public build variables from Brimble
        env:
          BRIMBLE_API_KEY: ${{ secrets.BRIMBLE_API_KEY }}
        run: node scripts/ci/brimble-build-env.mjs "$BRIMBLE_PROJECT_ID" > "$RUNNER_TEMP/build.env"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/app/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          secret-files: |
            buildenv=${{ runner.temp }}/build.env
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: build
    if: vars.BRIMBLE_IMAGE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      # Pushes made with GITHUB_TOKEN don't start workflows, so this can't loop.
      - name: Pin the image in the root Dockerfile
        env:
          IMAGE_REF: ${{ needs.build.outputs.image }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git pull --rebase --quiet origin master
            sed -i -E "s#^FROM ghcr\.io/.*#FROM ${IMAGE_REF}#" Dockerfile
            if git diff --quiet -- Dockerfile; then echo "Dockerfile already pins ${IMAGE_REF}"; exit 0; fi
            git commit --quiet -m "deploy: ${IMAGE_REF##*:}" -- Dockerfile
            git push --quiet origin HEAD:master && exit 0
            git reset --quiet --hard origin/master
          done
          echo "Could not push the release commit" >&2
          exit 1
