name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - create-cencori-app
          - cencori
          - both

# npm trusted publishing (OIDC): no npm token is stored anywhere. Each package
# lists this repo + workflow as its trusted publisher on npmjs.com, and every
# release carries provenance (which commit and workflow built it).
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11.6.2

      - name: Publish create-cencori-app
        if: inputs.package == 'create-cencori-app' || inputs.package == 'both'
        working-directory: packages/create-cencori-app
        run: |
          npm ci
          npm test
          npm publish --access public --provenance

      - name: Publish cencori SDK
        if: inputs.package == 'cencori' || inputs.package == 'both'
        working-directory: packages/sdk
        run: |
          npm ci
          npm run build
          npm publish --access public --provenance
